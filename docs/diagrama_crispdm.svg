   </g>
   <g id="text_14">
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(392.4 434.294719)">Streamlit: imagen o cámara</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(392.4 447.593719)">CNN T6: calidad y confianza</text>
