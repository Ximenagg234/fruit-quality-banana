    <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #193b53" x="21.6" y="35.600625" transform="rotate(-0 21.6 35.600625)">CRISP-DM | Calidad y tamaño de frutas</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52616b" x="21.6" y="51.84" transform="rotate(-0 21.6 51.84)">Flujo del proyecto • seis especies • tres clases de calidad</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #193b53" x="32.4" y="102.398281" transform="rotate(-0 32.4 102.398281)">01  Comprensión del negocio</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(32.4 131.894719)">Clasificación manual lenta y subjetiva</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(32.4 145.193719)">Calidad: Buena / Regular / Mala</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(32.4 158.757914)">Tamaño relativo; apoyo a decisiones</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #193b53" x="392.4" y="102.398281" transform="rotate(-0 392.4 102.398281)">02  Comprensión de datos</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(392.4 131.894719)">Kaggle: 19 526 imágenes; 6 especies</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(392.4 145.193719)">Desbalance y atajo del fondo</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(392.4 158.678719)">Mixed: sin etiquetas individuales</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #193b53" x="392.4" y="253.598281" transform="rotate(-0 392.4 253.598281)">03  Preparación de datos</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(392.4 283.809656)">Mixed: 760 recortes anotados</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(392.4 296.579719)">Grupos por objeto físico inferido</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(392.4 310.064719)">Train / validación / prueba por grupo</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #193b53" x="32.4" y="253.158281" transform="rotate(-0 32.4 253.158281)">04  Modelado</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(32.4 283.094719)">Regresión logística, SVM y RF</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(32.4 296.393719)">CNN desde cero: T6 y T7</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(32.4 309.878719)">Ajuste agrupado; control solo borde</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #193b53" x="32.4" y="404.798281" transform="rotate(-0 32.4 404.798281)">05  Evaluación</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(32.4 434.721211)">Validación: T6, F1 macro 0.725</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(32.4 447.593719)">Prueba final: Kaggle + Mixed y</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #263746" transform="translate(32.4 461.078719)">69 fotos propias; T6 F1 macro 0.439</text>
   </g>
   <g id="text_13">
