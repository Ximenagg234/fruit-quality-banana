   <g id="text_1">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1b2d4f" x="425.7" y="17.997891" transform="rotate(-0 425.7 17.997891)">Clasificación de calidad y tamaño de frutas · CRISP-DM aplicado al proyecto</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #555555" x="425.7" y="34.629891" transform="rotate(-0 425.7 34.629891)">Cada fase lista lo que se hizo, el archivo que lo demuestra y lo que se decidió con datos medidos</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #2b4c7e" x="146.7" y="94.421991" transform="rotate(-0 146.7 94.421991)">1 · Comprensión del negocio</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(32.868 118.516216)">• Desperdicio de alimento; clasificación manual</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(32.868 128.624216)">   lenta y subjetiva</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(32.868 138.948934)">• Salidas: calidad (Buena, Regular, Mala) y tamaño</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(32.868 149.880466)">• Entrada: una fruta sobre fondo liso</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(32.868 159.935028)">• Ética e impactos: docs/etica_tabla.md,</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(32.868 169.558528)">   docs/impactos_matriz.md</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #2b4c7e" x="425.7" y="94.421991" transform="rotate(-0 425.7 94.421991)">2 · Comprensión de los datos</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(311.868 118.516216)">• Kaggle (CC0): 19 526 imágenes, 6 especies</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(311.868 128.624216)">• Regular no existe; Mixed sin etiquetas</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(311.868 138.884216)">• Hallazgo: el borde de la imagen ya predice</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(311.868 149.433372)">   la clase (F1 macro 0.76 a 0.96)</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(311.868 159.298528)">• 02_comprension_datos/eda.ipynb</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 9.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #2b4c7e" x="704.7" y="94.421991" transform="rotate(-0 704.7 94.421991)">3 · Preparación de los datos</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(590.868 118.364216)">• Grupos por objeto: tiempo, hash y contador</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(590.868 128.776216)">• Partición por grupo, sin fuga de datos</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(590.868 138.884216)">• Mixed: frutas individuales segmentadas</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(590.868 149.144216)">• Regular: recortes de Mixed etiquetados</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(590.868 159.468934)">• Tamaño: longitud normalizada (PCA)</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 9.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #2b4c7e" x="146.7" y="288.077991" transform="rotate(-0 146.7 288.077991)">4 · Modelado</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(32.868 312.556216)">• Línea base: clase mayoritaria</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(32.868 322.816216)">• ML tradicional: regresión logística, SVM,</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(32.868 332.924216)">   Random Forest (GridSearchCV agrupado)</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(32.868 343.532747)">• CNN desde cero 32-64-128: Flatten o GAP,</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(32.868 353.444216)">   Dropout, aumento de datos, L2</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(32.868 363.598528)">• Clasificador de especie · 04_modelado/</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 9.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #2b4c7e" x="425.7" y="288.461991" transform="rotate(-0 425.7 288.461991)">5 · Evaluación</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(311.868 312.556216)">• F1 macro, kappa ponderado, error estándar</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(311.868 322.664216)">• Globales y por especie</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(311.868 333.076216)">• Línea base "solo borde" junto a cada modelo</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(311.868 343.184216)">• Fotos propias: cambio de dominio</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(311.868 353.596216)">• Análisis de errores con imágenes</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(311.868 363.856216)">• Tiempo y energía de cómputo</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 9.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #2b4c7e" x="704.7" y="288.077991" transform="rotate(-0 704.7 288.077991)">6 · Despliegue</text>
   </g>
   <g id="text_14">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(590.868 312.556216)">• App Streamlit: subir imagen o usar la cámara</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(590.868 322.664216)">• Calidad, confianza y aviso de baja confianza</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(590.868 333.725184)">• Tamaño con la fruta resaltada</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(590.868 343.336216)">• En memoria: no guarda las imágenes</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(590.868 353.490528)">• Apoyo a la decisión · 06_despliegue/app.py</text>
   </g>
   <g id="text_15">
    <text style="font-style: italic; font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #b23a32" x="286.2" y="472.605891" transform="rotate(-0 286.2 472.605891)">Si no supera la línea base "solo borde" o falla en fotos propias: volver a modelado y a los datos</text>
   </g>
   <g id="text_16">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b4500" x="35.1" y="504.015567" transform="rotate(-0 35.1 504.015567)">Datos propios: fotos de 5 especies; Mixed con dos anotadores</text>
   </g>
   <g id="text_17">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1b5e20" x="369.9" y="504.171567" transform="rotate(-0 369.9 504.171567)">Control transversal: trazabilidad de la rúbrica, pruebas automáticas y revisión cruzada</text>
   </g>
  </g>
 </g>
 <defs>
